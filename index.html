<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Conquest of Westeros</title>
<style>

    font-family: 'BentonSans';
    src: url('assets/BentonSans-Cond.otf') format('opentype');
    font-weight: normal;
  }
  @font-face {
    font-family: 'BentonSans';
    src: url('assets/BentonSans-CondBold.otf') format('opentype');
    font-weight: bold;
  }
  @font-face {
    font-family: 'GoudyTrajan';

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    align-items: center;
  }
  canvas {

  }

    top: 8px;
    right: 8px;
    padding: 6px 10px;
    background: #334155;
    color: #94a3b8;
    border: 1px solid #475569;
    border-radius: 4px;
    font-size: 10px;
    cursor: pointer;
    z-index: 100;
  }
  #debug-btn:hover { background: #475569; color: #fff; }
  #debug-panel {
    display: none;
    position: fixed;
    top: 40px;
    right: 8px;
    width: 200px;
    padding: 12px;
    background: rgba(15, 23, 42, 0.98);

    border-radius: 8px;
    font-size: 11px;
    color: #cbd5e1;
    z-index: 100;

  #debug-panel label { display: block; margin: 6px 0; }

<div id="game-wrap">

</div>

}

function removeEdgeBgFromImage(img, isDark) {
  const c = document.createElement('canvas');
  const w = img.naturalWidth;
  const h = img.naturalHeight;
  c.width = w;
  c.height = h;
  const cctx = c.getContext('2d');
  cctx.drawImage(img, 0, 0);
  const d = cctx.getImageData(0, 0, w, h);
  const data = d.data;
  const visited = new Uint8Array(w * h);
  const isBg = isDark
    ? (idx) => data[idx] < 50 && data[idx + 1] < 50 && data[idx + 2] < 50
    : (idx) => data[idx] > 200 && data[idx + 1] > 200 && data[idx + 2] > 200;
  const stack = [];
  for (let x = 0; x < w; x++) { stack.push(x); stack.push(x + (h - 1) * w); }
  for (let y = 0; y < h; y++) { stack.push(y * w); stack.push((w - 1) + y * w); }
  while (stack.length) {
    const pos = stack.pop();
    if (pos < 0 || pos >= w * h || visited[pos]) continue;
    const idx = pos * 4;
    if (!isBg(idx)) continue;
    visited[pos] = 1;
    data[idx + 3] = 0;
    const x = pos % w, y = (pos - x) / w;
    if (x > 0) stack.push(pos - 1);
    if (x < w - 1) stack.push(pos + 1);
    if (y > 0) stack.push(pos - w);
    if (y < h - 1) stack.push(pos + w);
  }
  cctx.putImageData(d, 0, 0);
  return c;
}

function getSlashFrameRect(frame) {
  // Animations packed sequentially, 5 per row. Slash starts at absolute index 36.
  const absIdx = 36 + frame;
  const row = Math.floor(absIdx / 5);
  const col = absIdx % 5;
  return { sx: col * SPRITE_FRAME_W, sy: row * SPRITE_FRAME_H };
}

          const dy = (pyA - pathB[bi][1]) * 693;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestD2) { bestD2 = d2; bestBi = bi; }
        }
        if (bestBi >= 0 && bestD2 < SNAP2) {
          const [pxB, pyB] = pathB[bestBi];
          pts.push({ ai, mpx: (pxA + pxB) / 2, mpy: (pyA + pyB) / 2 });
          usedB.add(bestBi);
        }
      }
      if (pts.length >= 2) SHARED_BORDERS.push(pts);
    }
  }
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
const INSTRUCTION_FADE_MS = 8000;
let lastTapTime = 0;
let lastTapCastle = null;
let selectAllMode = false;

const POSITIONS_KEY = 'conquest-westeros-castle-positions';

function initCastles() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(POSITIONS_KEY)); } catch (_) {}
  castles = CASTLE_DEFS.map((c, i) => {
    const pos = saved && saved[c.id];
    const px = pos ? pos.px : c.px;
    const py = pos ? pos.py : c.py;
    return {
      ...c,
      px, py,
      x: W() * px,
      y: H() * py,
      troops: c.troops,
      owner: c.owner === 'player' ? 'player' : (c.owner === 'neutral' ? 'neutral' : c.house),
    };
  });
  fleets = [];
  dragStartCastle = null;
  selectedCastles = [];
  gameOver = null;
  gameStartTime = Date.now();
  if (DEBUG) console.log('Castle owners:', castles.map(c => `${c.name}: owner=${c.owner}, house=${c.house}`));
  castles.filter(c => c.owner !== 'player').forEach(c => {
    aiCooldowns[c.id] = 20 + Math.random() * 60;
  });
}

function getCastleAt(x, y) {
  const hitRadius = CASTLE_IMG_SIZE * 0.6;
  for (let i = castles.length - 1; i >= 0; i--) {
    const c = castles[i];
    if (Math.hypot(x - c.x, y - c.y) < hitRadius) return c;
  }
  return null;
}

function sendTroops(from, to) {
  const count = Math.floor(from.troops * sendRatio);
  if (count < 1 || from === to) return;
  from.troops -= count;
  fleets.push({ x: from.x, y: from.y, target: to, troops: count, owner: from.owner, house: from.house });
}

function runAI() {
  if (!debugAIEnabled) return;
  const elapsed = Date.now() - gameStartTime;
  if (elapsed < AI_GRACE_MS) return;
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  castles.forEach(c => {
    if (c.owner === 'player' || c.owner === 'neutral') return;
    const cd = aiCooldowns[c.id] ?? 0;
    if (cd > 0) { aiCooldowns[c.id] = cd - 1; return; }
    if (c.troops < AI_MIN_TROOPS) return;

    const others = castles.filter(t => t !== c && t.owner !== c.owner);
    if (others.length === 0) return;
    // Prefer neutral and other AI castles; only target player after safety period
    let targets = others.filter(t => t.owner !== 'player');
    if (targets.length === 0 || elapsed >= AI_PLAYER_SAFETY_MS) targets = others;
    const nearest = targets.reduce((a, b) => (d(c, a) < d(c, b) ? a : b));

    const available = c.troops - AI_GARRISON;
    if (available < 5 || !nearest) return;

    const incomingThreats = fleets.filter(f => f.target === c && f.owner !== c.owner);
    const incomingTroops = incomingThreats.reduce((sum, f) => sum + f.troops, 0);
    if (incomingTroops > 0 && c.troops - incomingTroops < AI_GARRISON) return;

    let ratio = AI_SEND_RATIO;
    if (nearest.troops > available * 0.8) ratio = 0.7;
    else if (nearest.troops < available * 0.3) ratio = 0.35;

    const count = Math.min(Math.floor(c.troops * ratio), available);
    if (count >= 5) {
      if (DEBUG) console.log(`${c.name}(${c.owner}) → ${nearest.name}(${nearest.owner}) [${count} troops, keeping ${Math.floor(c.troops - count)}]`);
      c.troops -= count;
      fleets.push({ x: c.x, y: c.y, target: nearest, troops: count, owner: c.owner, house: c.house });
      aiCooldowns[c.id] = AI_COOLDOWN_MIN + Math.random() * (AI_COOLDOWN_MAX - AI_COOLDOWN_MIN);
    }
  });
}

function update() {
  if (gameOver) return;
  if (debugEditMode) return;

  castles.forEach(c => {
    if (c.owner !== 'neutral') c.troops += TROOP_GROWTH;
  });

  runAI();

  const now = Date.now();
  spriteRunTimer += 16;
  if (spriteRunTimer >= 1000 / SPRITE_FPS) {
    spriteRunFrame = (spriteRunFrame + 1) % SPRITE_RUN_FRAMES;
    spriteRunTimer = 0;
  }

  attackAnimations.forEach(a => {
    a.timer += 16;
    if (a.timer >= 1000 / SPRITE_FPS) {
      a.frame++;
      a.timer = 0;
    }
  });
  attackAnimations = attackAnimations.filter(a => a.frame < SPRITE_ATTACK_FRAMES);

  fleets.forEach(f => {
    const dx = f.target.x - f.x;
    const dy = f.target.y - f.y;
    const dist = Math.hypot(dx, dy);
    if (dist < FLEET_SPEED) {
      const arrivalAngle = Math.atan2(f.target.y - f.y, f.target.x - f.x);
      if (f.target.owner === f.owner) {
        f.target.troops += f.troops;
      } else {
        f.target.troops -= f.troops;
        if (f.target.troops < 0) {
          attackAnimations.push({ x: f.target.x, y: f.target.y, frame: 0, timer: 0, owner: f.owner, angle: arrivalAngle });
          const wasPlayerCastle = f.target.owner === 'player';
          f.target.owner = f.owner;
          f.target.house = f.house;
          f.target.troops = Math.abs(f.target.troops);
          if (f.owner === 'player') {
            sfxCastleVictory.currentTime = 0; sfxCastleVictory.play().catch(() => {});
          } else if (wasPlayerCastle) {
            sfxCastleDefeat.currentTime = 0; sfxCastleDefeat.play().catch(() => {});
          }
          const color = HOUSES[f.house]?.color || '#fff';
          for (let p = 0; p < 10; p++) {
            const spread = (Math.random() - 0.5) * 1.2;
            const speed = 1.5 + Math.random() * 2;
            impactParticles.push({
              x: f.target.x, y: f.target.y,
              vx: Math.cos(arrivalAngle + spread) * speed,
              vy: Math.sin(arrivalAngle + spread) * speed,
              alpha: 1, size: 2 + Math.random() * 3, color
            });
          }
        }
      }
      f.arrived = true;
    } else {
      f.x += (dx / dist) * FLEET_SPEED;
      f.y += (dy / dist) * FLEET_SPEED;
    }
  });
  fleets = fleets.filter(f => !f.arrived);

  selectedCastles = selectedCastles.filter(c => c.owner === 'player');

  const playerCastles = castles.filter(c => c.owner === 'player');
  const enemyCastles = castles.filter(c => c.owner !== 'player' && c.owner !== 'neutral');
  const playerFleets = fleets.filter(f => f.owner === 'player');
  if (playerCastles.length === 0 && playerFleets.length === 0) gameOver = 'defeat';
  const nonNeutralNonPlayer = castles.filter(c => c.owner !== 'player' && c.owner !== 'neutral');
  if (nonNeutralNonPlayer.length === 0 && playerCastles.length > 0) {
    gameOver = 'victory';
    sfxVictory.currentTime = 0;
    sfxVictory.play().catch(() => {});
    sfxRoar.currentTime = 0;
    sfxRoar.play().catch(() => {});
  }
}

function draw() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W(), H());

  if (mapImage.complete && mapImage.naturalWidth) {
    ctx.drawImage(mapImage, 0, 0, W(), H());
  } else {
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.moveTo(W() * 0.10, H() * 0.04);
    ctx.lineTo(W() * 0.90, H() * 0.06);
    ctx.lineTo(W() * 0.96, H() * 0.50);
    ctx.lineTo(W() * 0.72, H() * 0.96);
    ctx.lineTo(W() * 0.24, H() * 0.94);
    ctx.lineTo(W() * 0.04, H() * 0.46);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Region fill pass on the off-screen canvas:
  // 1. Draw each region fill at full opacity (no alpha-blending between fills).
  // 2. Composite at 55% so the parchment texture shows through.
  // 3. Draw shared border lines (midpoints of adjacent vertex pairs) on the main
  //    canvas — exactly one line per shared boundary, no colored or doubled strokes.
  const dpr = window.devicePixelRatio || 1;
  regionFillCanvas.width = canvas.width;
  regionFillCanvas.height = canvas.height;
  const fctx = regionFillCtx;
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, W(), H());

  // Step 1 — territory fills (full opacity, no blending between regions)
  Object.entries(REGIONS).forEach(([castleId, path]) => {
    if (path.length < 3) return;
    const castle = castles.find(c => c.id === castleId);
    const owner = castle ? castle.owner : 'neutral';
    const regionColor = owner === 'player' ? '#4a90e2' : owner === 'neutral' ? '#808080' : '#d94040';
    fctx.beginPath();
    path.forEach(([px, py], i) => {
      const x = px * W(), y = py * H();
      if (i === 0) fctx.moveTo(x, y); else fctx.lineTo(x, y);
    });
    fctx.closePath();
    fctx.fillStyle = regionColor;
    fctx.fill();
  });

  // Step 2 — composite fills onto the map
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.drawImage(regionFillCanvas, 0, 0, W(), H());
  ctx.restore();

  // Step 3 — bold region outlines. Adjacent regions share exact vertices so
  // each shared edge is drawn once per neighbour at the same position, giving
  // a clean single bold border with no doubling artefacts.
  ctx.save();
  ctx.strokeStyle = '#1e1008';
  ctx.lineWidth = Math.max(2, W() * 0.005);
  ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.85;
  Object.values(REGIONS).forEach(path => {
    if (path.length < 3) return;
    ctx.beginPath();
    path.forEach(([px, py], i) => {
      const x = px * W(), y = py * H();
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.stroke();
  });
  ctx.restore();



  // Draw live freehand path while region drawing is active
  if (debugRegionMode && currentRegionPath.length > 1) {
    ctx.beginPath();
    currentRegionPath.forEach(([px, py], i) => {
      const x = px * W(), y = py * H();
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.save();
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  // Snap highlight — yellow ring when drawing cursor is locked to an existing vertex
  if (debugRegionMode && drawSnapHighlight) {
    const sx = drawSnapHighlight.px * W(), sy = drawSnapHighlight.py * H();
    ctx.save();
    ctx.beginPath();
    ctx.arc(sx, sy, 8, 0, Math.PI * 2);
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(sx, sy, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#facc15';
    ctx.fill();
    ctx.restore();
  }

  // Eraser cursor circle
  if (isEraserMode && eraserPos) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(eraserPos.x, eraserPos.y, eraserRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,80,80,0.85)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(eraserPos.x, eraserPos.y, eraserRadius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,80,80,0.12)';
    ctx.fill();
    ctx.restore();
  }

  if (dragStartCastle && !debugEditMode) {
    const sources = selectedCastles.length ? selectedCastles : [dragStartCastle];
    sources.forEach(c => {
      const dx = dragX - c.x, dy = dragY - c.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 5) return;
      const angle = Math.atan2(dy, dx);
      ctx.strokeStyle = 'rgba(201, 162, 39, 0.85)';
      ctx.lineWidth = 5;
      ctx.setLineDash([10, 6]);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(dragX, dragY);
      ctx.stroke();
      ctx.setLineDash([]);
      const arrLen = 16;
      ctx.fillStyle = 'rgba(201, 162, 39, 0.9)';
      ctx.beginPath();
      ctx.moveTo(dragX, dragY);
      ctx.lineTo(dragX - arrLen * Math.cos(angle - 0.4), dragY - arrLen * Math.sin(angle - 0.4));
      ctx.lineTo(dragX - arrLen * Math.cos(angle + 0.4), dragY - arrLen * Math.sin(angle + 0.4));
      ctx.closePath();
      ctx.fill();
    });
  }

  const pulseT = Date.now() * 0.003;
  castles.forEach(c => {
    const h = HOUSES[c.house];
    const isSelected = selectedCastles.includes(c);
    const isPlayerCastle = c.owner === 'player';
    const assetKey = c.asset || c.house;
    const img = castleImages[assetKey];
    const half = CASTLE_IMG_SIZE / 2;
    const circleR = half + 4;

    const processed = c.owner === 'player' ? castleImagesBlue[assetKey]
                    : c.owner === 'neutral' ? castleImagesGrey[assetKey]
                    : castleImagesRed[assetKey];
    if (processed) {
      ctx.drawImage(processed, 0, 0, processed.width, processed.height, c.x - half, c.y - half, CASTLE_IMG_SIZE, CASTLE_IMG_SIZE);
    } else if (img && img.complete && img.naturalWidth) {
      ctx.drawImage(img, c.x - half, c.y - half, CASTLE_IMG_SIZE, CASTLE_IMG_SIZE);
    }


    if (isSelected) {
      ctx.strokeStyle = 'rgba(201, 162, 39, 0.9)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.arc(c.x, c.y, circleR - 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }


    const troopStr = String(Math.floor(c.troops));
    ctx.font = 'bold 15px BentonSans, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.strokeText(troopStr, c.x, c.y);
    ctx.fillStyle = '#fff';
    ctx.fillText(troopStr, c.x, c.y);

    ctx.font = 'bold 11px BentonSans, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.strokeText(c.name, c.x, c.y + half + 6);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(c.name, c.x, c.y + half + 6);
  });

  impactParticles = impactParticles.filter(p => p.alpha > 0);
  impactParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.88;
    p.vy *= 0.88;
    p.alpha -= 0.045;
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  const FLEET_DRAW_H = 54;
  const FLEET_DRAW_W = SPRITE_FRAME_W * (FLEET_DRAW_H / SPRITE_FRAME_H);

  fleets.forEach(f => {
    const runSheet = f.owner === 'player' ? knightRunBlue : knightRunRed;
    const angle = Math.atan2(f.target.y - f.y, f.target.x - f.x);
    const facingLeft = Math.cos(angle) < 0;
    if (runSheet.complete && runSheet.naturalWidth) {
      const frameX = spriteRunFrame * SPRITE_FRAME_W;
      ctx.save();
      ctx.translate(f.x, f.y);
      if (!facingLeft) ctx.scale(-1, 1);
      ctx.drawImage(runSheet, frameX, 0, SPRITE_FRAME_W, SPRITE_FRAME_H,
        -FLEET_DRAW_W / 2, -FLEET_DRAW_H / 2, FLEET_DRAW_W, FLEET_DRAW_H);
      ctx.restore();
    } else {
      const h = HOUSES[f.house] || HOUSES.stark;
      ctx.fillStyle = h.color;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 14, 0, Math.PI * 2);
      ctx.fill();
    }
    const troopBadge = String(Math.floor(f.troops));
    ctx.font = 'bold 9px BentonSans, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.beginPath();
    ctx.arc(f.x, f.y - FLEET_DRAW_H / 2 - 6, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(troopBadge, f.x, f.y - FLEET_DRAW_H / 2 - 6);
  });

  attackAnimations.forEach(a => {
    const sheet = a.owner === 'player' ? knightSheetBlue : knightSheetRed;
    if (!sheet.complete || !sheet.naturalWidth) return;
    const { sx, sy } = getSlashFrameRect(a.frame);
    const facingLeft = Math.cos(a.angle) < 0;
    ctx.save();
    ctx.translate(a.x, a.y);
    if (!facingLeft) ctx.scale(-1, 1);
    ctx.drawImage(sheet, sx, sy, SPRITE_FRAME_W, SPRITE_FRAME_H,
      -FLEET_DRAW_W / 2, -FLEET_DRAW_H / 2, FLEET_DRAW_W, FLEET_DRAW_H);
    ctx.restore();
  });
  ctx.globalAlpha = 1;

  if (dragStartCastle && !debugEditMode && targetMarkerImage.complete && targetMarkerImage.naturalWidth) {
    const sources = selectedCastles.length ? selectedCastles : [dragStartCastle];
    const hoverTarget = dragSnapTarget || getCastleAt(dragX, dragY);
    if (hoverTarget && !sources.includes(hoverTarget)) {
      const markerSize = (CASTLE_IMG_SIZE - 8) * 0.7;
      const markerHalf = markerSize / 2;
      ctx.drawImage(targetMarkerImage, hoverTarget.x - markerHalf, hoverTarget.y - markerHalf, markerSize, markerSize);
    }
  }

  // Ghost finger tutorial animation
  if (!gameOver && !debugEditMode) {
    const elapsed = Date.now() - gameStartTime;
    const GHOST_TOTAL = 6500;
    const playerCastle = castles.find(c => c.owner === 'player');
    const enemies = castles.filter(c => c.owner !== 'player');
    if (elapsed < GHOST_TOTAL && playerCastle && enemies.length) {
      const nearestEnemy = castles.find(c => c.id === 'stormsend') ||
        enemies.reduce((a, b) =>
          Math.hypot(b.x - playerCastle.x, b.y - playerCastle.y) <
          Math.hypot(a.x - playerCastle.x, a.y - playerCastle.y) ? b : a);

      const FADE_IN   = 700;
      const TAP_DOWN  = 1200;
      const TAP_UP    = 1700;
      const DRAG_END  = 4500;
      const REL_END   = 5200;
      const FADE_OUT  = 6500;

      let alpha = 1;
      if (elapsed < FADE_IN)        alpha = elapsed / FADE_IN;
      else if (elapsed > REL_END)   alpha = Math.max(0, 1 - (elapsed - REL_END) / (FADE_OUT - REL_END));

      // Finger position
      let fx, fy;
      if (elapsed <= TAP_UP) {
        fx = playerCastle.x; fy = playerCastle.y;
      } else if (elapsed <= DRAG_END) {
        const t = (elapsed - TAP_UP) / (DRAG_END - TAP_UP);
        const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
        fx = playerCastle.x + (nearestEnemy.x - playerCastle.x) * e;
        fy = playerCastle.y + (nearestEnemy.y - playerCastle.y) * e;
      } else {
        fx = nearestEnemy.x; fy = nearestEnemy.y;
      }

      // Press scale (squish on tap-down, release on lift)
      const pressing = elapsed >= TAP_DOWN && elapsed < TAP_UP;
      const pressT = pressing ? (elapsed - TAP_DOWN) / (TAP_UP - TAP_DOWN) : 0;
      const fingerScale = pressing ? (1 - 0.25 * Math.sin(pressT * Math.PI)) : 1;

      // Ripple on tap-down and on release at enemy
      const showTapRipple = elapsed >= TAP_DOWN && elapsed < TAP_DOWN + 600;
      const showRelRipple = elapsed >= DRAG_END && elapsed < DRAG_END + 700;
      if (showTapRipple || showRelRipple) {
        const rt = showTapRipple ? (elapsed - TAP_DOWN) / 600 : (elapsed - DRAG_END) / 700;
        ctx.save();
        ctx.globalAlpha = (1 - rt) * alpha * 0.7;
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(fx, fy, 18 + rt * 28, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Draw pointer image (finger points up; rotate 180° so it points down at target)
      if (pointerImage.complete && pointerImage.naturalWidth) {
        const pSize = 64;
        const pHalf = pSize / 2;
        ctx.save();
        ctx.globalAlpha = alpha;
        // Rotate 90° CW so finger points down; translate so the fingertip (top of image) sits at castle center
        ctx.translate(fx, fy);
        ctx.rotate(Math.PI);
        ctx.scale(fingerScale, fingerScale);
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 4;
        // Offset so the actual fingertip pixel lands on the troop number at castle center
        ctx.drawImage(pointerImage, -pHalf - 14, -pSize * 0.18, pSize, pSize);
        ctx.restore();
      }
    }
  }

  if (!gameOver && !debugEditMode) {
    ctx.font = 'bold 16px BentonSans, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';

    const elapsed = Date.now() - gameStartTime;

    // Intro text: fades in then out
    const INTRO_FADE_IN = 500;
    const INTRO_HOLD = 4000;
    const INTRO_FADE_OUT = 5500;
    if (elapsed < INTRO_FADE_OUT) {
      let alpha;
      if (elapsed < INTRO_FADE_IN) alpha = elapsed / INTRO_FADE_IN;
      else if (elapsed < INTRO_HOLD) alpha = 1;
      else alpha = 1 - (elapsed - INTRO_HOLD) / (INTRO_FADE_OUT - INTRO_HOLD);
      alpha = Math.max(0, Math.min(1, alpha)) * 0.95;

      const line1 = 'Capture enemy';
      const highlight = 'strongholds';
      const line2 = 'to crush the rebels';
      const line3 = 'and secure your throne!';
      const font = 'bold 18px BentonSans, sans-serif';
      const iy = H() / 2;
      const lineH = 26;

      // Dark background strip
      ctx.fillStyle = `rgba(0,0,0,${alpha * 0.55})`;
      ctx.fillRect(0, iy - lineH * 2, W(), lineH * 4 + 8);

      ctx.font = font;
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 4;
      ctx.lineJoin = 'round';

      // Line 1: "Capture enemy strongholds" — measure to split color mid-line
      const l1Full = line1 + ' ' + highlight;
      const l1W = ctx.measureText(l1Full).width;
      const l1x = W() / 2 - l1W / 2;
      const l1y = iy - lineH;

      ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
      ctx.textAlign = 'left';
      ctx.strokeText(line1 + ' ', l1x, l1y);
      ctx.strokeText(highlight, l1x + ctx.measureText(line1 + ' ').width, l1y);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fillText(line1 + ' ', l1x, l1y);
      ctx.fillStyle = `rgba(220,80,60,${alpha})`;
      ctx.fillText(highlight, l1x + ctx.measureText(line1 + ' ').width, l1y);

      // Lines 2 & 3
      ctx.textAlign = 'center';
      [line2, line3].forEach((line, i) => {
        const ly = iy + i * lineH;
        ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
        ctx.strokeText(line, W() / 2, ly);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fillText(line, W() / 2, ly);
      });
    }

  }

  if (DEBUG && debugOverlay) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, 140, 22 + castles.length * 14);
    ctx.fillStyle = '#c9a227';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Castle | Troops | Owner', 6, 14);
    castles.forEach((c, i) => {
      ctx.fillStyle = c.owner === 'player' ? '#39ff14' : '#94a3b8';
      ctx.fillText(`${c.name || c.id} | ${Math.floor(c.troops)} | ${c.owner}`, 6, 28 + i * 14);
    });
    ctx.textAlign = 'center';
  }

  // ── Territory control bar (vertical, right side) ──────────────────────────
  if (!gameOver) {
    const playerCount  = castles.filter(c => c.owner === 'player').length;
    const neutralCount = castles.filter(c => c.owner === 'neutral').length;
    const enemyCount   = castles.length - playerCount - neutralCount;
    const total = (playerCount + enemyCount + neutralCount) || 1;
    const playerPct  = playerCount  / total;
    const enemyPct   = enemyCount   / total;
    const neutralPct = neutralCount / total;

    const barW   = Math.round(W() * 0.055);   // thin vertical bar
    const barH   = Math.round(H() * 0.42);    // 42% of canvas height
    const pad    = Math.round(W() * 0.025);   // padding from right/top edges
    const radius = 6;
    const contPad = 4;                         // inner padding inside container

    // Container position (bar sits inside with contPad gap)
    const contW = barW + contPad * 2;
    const contH = barH + contPad * 2;
    const contX = W() - contW - pad;
    const contY = pad;
    const bx    = contX + contPad;
    const by    = contY + contPad;

    ctx.save();

    // --- Container background & border ---
    ctx.globalAlpha = 0.82;
    ctx.fillStyle = 'rgba(10, 8, 5, 0.70)';
    ctx.beginPath();
    ctx.roundRect(contX, contY, contW, contH, radius + 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#c9a227';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(contX, contY, contW, contH, radius + 2);
    ctx.stroke();

    // --- Clip bar segments to rounded rect ---
    ctx.globalAlpha = 0.92;
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(bx, by, barW, barH, radius);
    ctx.clip();

    // Enemy (red) — top
    const eyH = enemyPct  * barH;
    // Neutral (gray) — middle
    const nyH = neutralPct * barH;
    // Player (blue) — bottom
    const pyH = playerPct * barH;

    ctx.fillStyle = '#c0392b';
    ctx.fillRect(bx, by, barW, eyH);
    ctx.fillStyle = '#808080';
    ctx.fillRect(bx, by + eyH, barW, nyH);
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(bx, by + eyH + nyH, barW, pyH);

    ctx.restore(); // end clip

    // --- Divider lines ---
    ctx.globalAlpha = 0.45;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    if (eyH > 0 && nyH + pyH > 0) {
      ctx.beginPath(); ctx.moveTo(bx, by + eyH); ctx.lineTo(bx + barW, by + eyH); ctx.stroke();
    }
    if (pyH > 0 && eyH + nyH > 0) {
      ctx.beginPath(); ctx.moveTo(bx, by + eyH + nyH); ctx.lineTo(bx + barW, by + eyH + nyH); ctx.stroke();
    }

    // --- Labels (% inside each segment) ---
    ctx.globalAlpha = 1;
    const fs = Math.max(9, Math.round(barW * 0.55));
    ctx.font = `700 ${fs}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const midX = bx + barW / 2;

    if (enemyPct > 0.10) {
      ctx.fillStyle = '#fff';
      ctx.fillText(`${Math.round(enemyPct * 100)}%`, midX, by + eyH / 2);
    }
    if (neutralPct > 0.10) {
      ctx.fillStyle = '#ede8dc';
      ctx.fillText(`${Math.round(neutralPct * 100)}%`, midX, by + eyH + nyH / 2);
    }
    if (playerPct > 0.10) {
      ctx.fillStyle = '#fff';
      ctx.fillText(`${Math.round(playerPct * 100)}%`, midX, by + eyH + nyH + pyH / 2);
    }

    ctx.restore();
  }

  if (gameOver) {
    if (splashImage.complete && splashImage.naturalWidth) {
      const imgAspect = splashImage.naturalWidth / splashImage.naturalHeight;
      const canvasAspect = W() / H();
      let sx = 0, sy = 0, sw = splashImage.naturalWidth, sh = splashImage.naturalHeight;
      if (imgAspect > canvasAspect) {
        sw = sh * canvasAspect;
        sx = (splashImage.naturalWidth - sw) / 2;
      } else {
        sh = sw / canvasAspect;
        sy = (splashImage.naturalHeight - sh) / 2;
      }
      ctx.drawImage(splashImage, sx, sy, sw, sh, 0, 0, W(), H());
    }
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W(), H());

    const cx = W() / 2, cy = H() / 2;
    const isLandscape = W() > H();
    const panelW = isLandscape ? Math.min(W() * 0.50, 380) : W() * 0.72;
    const panelH = Math.min(Math.round(H() * 0.37), 260);
    const panelX = cx - panelW / 2, panelY = H() - panelH - H() * 0.10;
    const borderPulse = 0.6 + 0.4 * Math.sin(Date.now() * 0.003);

    // Title area: fire splash behind logo, centered above panel
    const titleW = isLandscape ? W() * 0.55 : W() * 0.88;
    const titleCenterY = panelY * 0.48;
    if (titleFireImage.complete && titleFireImage.naturalWidth) {
      const fireAspect = titleFireImage.naturalWidth / titleFireImage.naturalHeight;
      const fireW = titleW;
      const fireH = fireW / fireAspect;
      ctx.drawImage(titleFireImage, cx - fireW / 2, titleCenterY - fireH / 2, fireW, fireH);
    }
    if (titleLogoImage.complete && titleLogoImage.naturalWidth) {
      const logoAspect = titleLogoImage.naturalWidth / titleLogoImage.naturalHeight;
      const logoW = titleW * 0.82;
      const logoH = logoW / logoAspect;
      ctx.drawImage(titleLogoImage, cx - logoW / 2, titleCenterY - logoH / 2, logoW, logoH);
    }

    ctx.strokeStyle = gameOver === 'victory'
      ? `rgba(201, 162, 39, ${borderPulse})`
      : `rgba(192, 57, 43, ${borderPulse})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(panelX, panelY, panelW, panelH, 12);
    ctx.stroke();

    ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
    ctx.beginPath();
    ctx.roundRect(panelX, panelY, panelW, panelH, 12);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.roundRect(panelX, panelY, panelW, panelH, 12);
    ctx.clip();

    const panelInner = panelW - 32;
    ctx.textAlign = 'center';

    const titleFS = Math.max(16, Math.round(panelH * 0.10));
    const subFS   = Math.max(11, Math.round(panelH * 0.054));

    if (gameOver === 'victory') {
      ctx.fillStyle = '#c9a227';
      ctx.font = `bold ${titleFS}px GoudyTrajan, Georgia`;
      ctx.fillText('Conquest Complete!', cx, panelY + panelH * 0.17, panelInner);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = `${subFS}px BentonSans, sans-serif`;
      ctx.fillText('Tap to claim the Iron Throne!', cx, panelY + panelH * 0.29, panelInner);
    } else {
      ctx.fillStyle = '#c0392b';
      ctx.font = `bold ${titleFS}px GoudyTrajan, Georgia`;
      ctx.fillText('Failed', cx, panelY + panelH * 0.17, panelInner);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = `${subFS}px BentonSans, sans-serif`;
      ctx.fillText('Your forces have been vanquished.', cx, panelY + panelH * 0.29, panelInner);
    }

    // Store badges — official badge images
    const badgeH = Math.round(panelH * 0.20), badgeGap = 10;
    const badgeW = (panelW - 28 - badgeGap) / 2;
    const badgeY = panelY + panelH - badgeH - 14;
    const appleX = panelX + 14;
    const playX = appleX + badgeW + badgeGap;

    if (appStoreBadgeImage.complete && appStoreBadgeImage.naturalWidth) {
      ctx.drawImage(appStoreBadgeImage, appleX, badgeY, badgeW, badgeH);
    }
    if (googlePlayBadgeImage.complete && googlePlayBadgeImage.naturalWidth) {
      ctx.drawImage(googlePlayBadgeImage, playX, badgeY, badgeW, badgeH);
    }

    ctx.restore();
  }
}

function gameLoop() {
  castles.forEach(c => {
    c.x = W() * (c.px ?? c.x / W());
    c.y = H() * (c.py ?? c.y / H());
  });
  debugSpeedAccum += debugSpeed;
  while (debugSpeedAccum >= 1) { update(); debugSpeedAccum -= 1; }
  draw();
  requestAnimationFrame(gameLoop);
}

function toCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  // getBoundingClientRect and clientX/Y are both in CSS pixels,
  // which matches our W()/H() logical coordinate system.
  return {
    x: clientX - rect.left,
    y: clientY - rect.top,
  };
}

function handleCTA() {
  const STORE_URL = 'https://example.com/download';
  if (typeof FbPlayableAd !== 'undefined' && FbPlayableAd.onCTAClick) {
    FbPlayableAd.onCTAClick();
  } else {
    window.open(STORE_URL, '_blank');
  }
}

function handlePointerDown(clientX, clientY) {
  if (gameOver) {
    const { x, y } = toCanvasCoords(clientX, clientY);
    const isLandscape = W() > H();
    const panelW = isLandscape ? Math.min(W() * 0.50, 380) : W() * 0.72;
    const panelH = Math.min(Math.round(H() * 0.37), 260);
    const panelX = W() / 2 - panelW / 2;
    const panelY = H() - panelH - H() * 0.10;
    const badgeH = Math.round(panelH * 0.20), badgeGap = 10;
    const badgeW = (panelW - 28 - badgeGap) / 2;
    const badgeY = panelY + panelH - badgeH - 14;
    const appleX = panelX + 14;
    const playX = appleX + badgeW + badgeGap;
    if (y >= badgeY && y <= badgeY + badgeH) {
      if ((x >= appleX && x <= appleX + badgeW) || (x >= playX && x <= playX + badgeW)) {
        handleCTA();
        return;
      }
    }
    return;
  }

  const { x, y } = toCanvasCoords(clientX, clientY);



  pointerDownX = x;
  pointerDownY = y;
  const castle = getCastleAt(x, y);

  if (debugEditMode && castle) {
    dragStartCastle = castle;
    dragOffsetX = x - castle.x;
    dragOffsetY = y - castle.y;
    dragX = x;
    dragY = y;
    return;
  }

  if (castle && castle.owner === 'player') {
    dragStartCastle = castle;
    dragX = x;
    dragY = y;
  }
}

function handlePointerMove(clientX, clientY) {
  if (!dragStartCastle) return;
  const { x, y } = toCanvasCoords(clientX, clientY);
  if (debugEditMode) {
    const c = dragStartCastle;
    c.x = x - dragOffsetX;
    c.y = y - dragOffsetY;
    c.px = c.x / W();
    c.py = c.y / H();
    dragX = x;
    dragY = y;
    return;
  }
  // Find nearest castle within snap radius (excluding sources)
  const sources = selectedCastles.length ? selectedCastles : [dragStartCastle];
  let best = null, bestDist = DRAG_SNAP_RADIUS;
  for (const c of castles) {
    if (sources.includes(c)) continue;
    const dist = Math.hypot(x - c.x, y - c.y);
    if (dist < bestDist) { bestDist = dist; best = c; }
  }
  dragSnapTarget = best;
  // Snap arrow tip to the castle center when close enough
  dragX = best ? best.x : x;
  dragY = best ? best.y : y;
}

function handlePointerUp(clientX, clientY) {
  if (!dragStartCastle) return;

  if (debugEditMode) {
    const c = dragStartCastle;
    c.px = c.x / W();
    c.py = c.y / H();
    const positions = {};
    castles.forEach(cs => { positions[cs.id] = { px: cs.px, py: cs.py }; });
    localStorage.setItem(POSITIONS_KEY, JSON.stringify(positions));
    dragStartCastle = null;
    return;
  }

  const { x, y } = toCanvasCoords(clientX, clientY);
  const moved = Math.hypot(x - pointerDownX, y - pointerDownY) > 15;
  // Use snapped target from drag, or fall back to direct hit test
  const castle = dragSnapTarget || getCastleAt(x, y);
  dragSnapTarget = null;

  if (moved && castle) {
    const sources = selectedCastles.length ? selectedCastles : (dragStartCastle ? [dragStartCastle] : []);
    sources.forEach(from => {
      if (from !== castle) sendTroops(from, castle);
    });
    if (sources.length) { selectedCastles = []; selectAllMode = false; }
  } else if (!moved) {
    if (dragStartCastle && dragStartCastle.owner === 'player') {
      const now = Date.now();
      if (lastTapCastle === dragStartCastle && now - lastTapTime < 350) {
        selectedCastles = castles.filter(c => c.owner === 'player');
        selectAllMode = true;
        lastTapCastle = null;
        lastTapTime = 0;
      } else {
        selectAllMode = false;
        const i = selectedCastles.indexOf(dragStartCastle);
        if (i >= 0) selectedCastles.splice(i, 1);
        else selectedCastles.push(dragStartCastle);
        lastTapCastle = dragStartCastle;
        lastTapTime = now;
      }
    } else {
      // Tapped empty space or a non-player castle — clear all selections
      selectedCastles = [];
      selectAllMode = false;
      lastTapCastle = null;
      lastTapTime = 0;
    }
  }

  dragStartCastle = null;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (debugRegionMode && debugRegionCastleId) {
    e.target.setPointerCapture(e.pointerId);
    const { x, y } = toCanvasCoords(e.clientX, e.clientY);
    isDrawingRegion = true;
    currentRegionPath = [[x / W(), y / H()]];
    return;
  }
  tryStartMusic();
  handlePointerDown(e.clientX, e.clientY);
  if (dragStartCastle) e.target.setPointerCapture(e.pointerId);
});
// Snap radius in CSS pixels — if the stylus/finger is within this distance of
// any vertex on an existing (other) region, we snap to that vertex exactly so
// the two regions share the same coordinate and have a perfect shared border.
const DRAW_SNAP_PX = 10;

function snapToExistingBorder(rawX, rawY) {
  const px = rawX / W(), py = rawY / H();
  let bestDist = DRAW_SNAP_PX + 1, bestPx = px, bestPy = py;
  Object.entries(REGIONS).forEach(([id, path]) => {
    if (id === debugRegionCastleId) return; // don't snap to self
    path.forEach(([vx, vy]) => {
      const d = Math.hypot((vx - px) * W(), (vy - py) * H());
      if (d < bestDist) { bestDist = d; bestPx = vx; bestPy = vy; }
    });
  });
  return { px: bestPx, py: bestPy, snapped: bestDist <= DRAW_SNAP_PX };
}

// Last snapped position for the drawing cursor highlight
let drawSnapHighlight = null;

canvas.addEventListener('pointermove', (e) => {
  if (isDrawingRegion) {
    const { x, y } = toCanvasCoords(e.clientX, e.clientY);
    const { px, py, snapped } = snapToExistingBorder(x, y);
    drawSnapHighlight = snapped ? { px, py } : null;
    const last = currentRegionPath[currentRegionPath.length - 1];
    const dx = px - last[0], dy = py - last[1];
    if (Math.hypot(dx * W(), dy * H()) > 6) {
      currentRegionPath.push([px, py]);
    }
    return;
  }
  if (isEraserMode) {
    const { x, y } = toCanvasCoords(e.clientX, e.clientY);
    eraserPos = { x, y };
    if (e.buttons) eraseVerticesAt(x, y); // erase while dragging
    return;
  }
  eraserPos = null;
  drawSnapHighlight = null;
  handlePointerMove(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', (e) => {
  e.preventDefault();
  if (isDrawingRegion) {
    isDrawingRegion = false;
    drawSnapHighlight = null;
    if (currentRegionPath.length >= 3) {
      REGIONS[debugRegionCastleId] = currentRegionPath.slice();
      try { localStorage.setItem(REGIONS_KEY, JSON.stringify(REGIONS)); } catch(err) {}
    }
    currentRegionPath = [];
    return;
  }
  handlePointerUp(e.clientX, e.clientY);
});
canvas.addEventListener('pointerleave', () => { eraserPos = null; });
canvas.addEventListener('pointercancel', () => {
  isDrawingRegion = false;
  drawSnapHighlight = null;
  eraserPos = null;
  currentRegionPath = [];
  dragStartCastle = null;
  dragSnapTarget = null;
});

function tintImage(sourceCanvas, color, opacity) {
  const c = document.createElement('canvas');
  c.width = sourceCanvas.width;
  c.height = sourceCanvas.height;
  const tctx = c.getContext('2d');
  tctx.drawImage(sourceCanvas, 0, 0);
  tctx.globalCompositeOperation = 'source-atop';
  tctx.fillStyle = color;
  tctx.globalAlpha = opacity;
  tctx.fillRect(0, 0, c.width, c.height);
  tctx.globalAlpha = 1;
  tctx.globalCompositeOperation = 'source-over';
  return c;
}

let assetsLoaded = false;
let assetsTotal = 0;
let assetsReady = 0;

function trackAsset(img, onDone) {
  assetsTotal++;
  const orig = img.onload;
  img.onload = () => {
    if (orig) orig();
    if (onDone) onDone();
    assetsReady++;
    if (assetsReady >= assetsTotal) {
      assetsLoaded = true;
      initCastles();
      gameLoop();
    }
  };
  img.onerror = () => {
    assetsReady++;
    if (assetsReady >= assetsTotal) {
      assetsLoaded = true;
      initCastles();
      gameLoop();
    }
  };
}

function drawLoadingScreen() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W(), H());

  ctx.fillStyle = '#c9a227';
  ctx.font = 'bold 26px GoudyTrajan, Georgia';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Conquest of Westeros', W() / 2, H() / 2 - 40);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '14px BentonSans, sans-serif';
  ctx.fillText('Loading...', W() / 2, H() / 2 + 10);

  const barW = W() * 0.5;
  const barH = 6;
  const barX = (W() - barW) / 2;
  const barY = H() / 2 + 35;
  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  ctx.roundRect(barX, barY, barW, barH, 3);
  ctx.fill();

  const progress = assetsTotal > 0 ? assetsReady / assetsTotal : 0;
  if (progress > 0) {
    ctx.fillStyle = '#c9a227';
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW * progress, barH, 3);
    ctx.fill();
  }

  if (!assetsLoaded) requestAnimationFrame(drawLoadingScreen);
}

function makeTintedCastle(img, tintColor) {
  const size = img.naturalWidth;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const cctx = c.getContext('2d');
  cctx.save();
  cctx.beginPath();
  cctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
  cctx.clip();
  cctx.drawImage(img, 0, 0);
  cctx.globalCompositeOperation = 'source-atop';
  cctx.fillStyle = tintColor;
  cctx.globalAlpha = 0.6;
  cctx.fillRect(0, 0, size, size);
  cctx.restore();
  return c;
}

function loadCastleImages() {
  CASTLE_ASSETS.forEach(house => {
    const img = new Image();
    const processImg = () => {
      try {
        castleImagesBlue[house] = makeTintedCastle(img, '#1d6fd1');
        castleImagesRed[house]  = makeTintedCastle(img, '#c0392b');
        castleImagesGrey[house] = makeTintedCastle(img, '#6b7280');
        castleImagesNoBg[house] = castleImagesGrey[house]; // default before ownership known
      } catch (_) {}
    };
    trackAsset(img, processImg);
    img.src = `assets/${house}.png`;
    castleImages[house] = img;
  });
}

trackAsset(mapImage);
mapImage.src = 'assets/map.png';
trackAsset(knightImage);

trackAsset(knightSheetRed);

trackAsset(selectionMarkerImage);

trackAsset(targetMarkerImage);
targetMarkerImage.src = 'assets/target-marker.png';
trackAsset(splashImage);
splashImage.src = 'assets/splash.jpg';
trackAsset(marchLineImage);
marchLineImage.src = 'assets/march-line.png';
trackAsset(titleFireImage);
titleFireImage.src = 'assets/title-fire.png';
trackAsset(titleLogoImage);
titleLogoImage.src = 'assets/title-logo.png';
trackAsset(pointerImage);
pointerImage.src = 'assets/pointer.png';

loadCastleImages();
drawLoadingScreen();
</script>
